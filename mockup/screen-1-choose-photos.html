<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose Photos · Photo Timeline</title>
  <meta name="description" content="Screen 1 of the Photo Timeline mockup: the empty state." />
  <link rel="stylesheet" href="assets/photo-timeline.css" />
  <script>
    /* set the theme before first paint so there is no flash */
    (function () {
      try {
        var t = localStorage.getItem('photo-timeline:theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body>

  <section class="tl-empty" data-od-id="screen-empty">
    <header class="tl-top" data-od-id="topbar">
      <span class="tl-mark">Photo Timeline</span>
      <div class="tl-theme" role="group" aria-label="Colour theme">
        <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
      </div>
    </header>

    <div class="tl-empty-mid">
      <div style="text-align: center;">
        <input type="file" id="tl-file" class="sr-only" webkitdirectory directory multiple />
        <button class="btn btn-primary" id="tl-choose" type="button" data-od-id="choose-photos">Choose Photos</button>
        <p id="tl-err" class="mono" hidden style="margin: 16px 0 0; font-size: 12px; color: var(--muted); max-width: 34ch;"></p>
      </div>
    </div>

    <footer class="tl-foot" data-od-id="statusbar">
      <a href="screen-2-timeline.html">Skip to the timeline →</a>
      <span>Nothing leaves this machine.</span>
    </footer>
  </section>

  <script src="assets/photo-timeline.js"></script>
  <script>
    TL.initTheme();

    var input = document.getElementById('tl-file');
    var err = document.getElementById('tl-err');
    var CAP = 1500;

    document.getElementById('tl-choose').addEventListener('click', function () {
      err.hidden = true;
      try {
        input.click();
      } catch (e) {
        err.hidden = false;
        err.textContent = 'The folder picker is blocked in this frame. Use “Skip to the timeline” to continue.';
      }
    });

    input.addEventListener('change', function () {
      if (!input.files || !input.files.length) return;
      /* File handles cannot survive a page change in a static mockup, so this
         is a real control with a known limit — the next screen loads its own
         set. See design-brief.md. */
      window.location.href = 'screen-2-timeline.html';
    });
  </script>
</body>
</html>

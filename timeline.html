<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Timeline · Photo Timeline</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('photo-timeline:theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <div class="tl-app" data-od-id="app-shell">
    <header class="tl-top" data-od-id="topbar">
      <div class="tl-brand">
        <span class="tl-mark">Photo Timeline</span>
        <span class="tl-dataset" id="tl-dataset">—</span>
      </div>
      <div class="tl-top-actions">
        <div class="tl-theme" role="group" aria-label="Colour theme">
          <button type="button" data-theme-set="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
        </div>
        <a class="btn btn-ghost" href="index.html">Add Photos</a>
      </div>
    </header>

    <div class="tl-body" id="tl-body" data-info="closed">
      <div class="tl-stage" id="tl-stage" tabindex="0" role="application"
           aria-label="Photo timeline. Drag or scroll to move along dates, click a photo to read its record.">
        <div class="tl-cloud" id="tl-cloud"></div>
        <div class="tl-plot" id="tl-plot"></div>
        <div class="tl-scale" id="tl-scale"></div>
      </div>

      <aside class="tl-info" id="tl-info" data-has-sel="false" data-od-id="info-panel">
        <button class="tl-info-tab" id="tl-info-tab" type="button" aria-expanded="false" aria-controls="tl-info-panel">
          <span class="tl-info-dot" aria-hidden="true"></span>
          <span class="mono">Record</span>
        </button>
        <div class="tl-info-panel" id="tl-info-panel" hidden>
          <div class="tl-info-head">
            <span>Record</span>
            <button class="tl-info-close" id="tl-info-close" type="button" aria-label="Close record panel">✕</button>
          </div>
          <div class="tl-info-body" id="tl-info-body"></div>
        </div>
      </aside>
    </div>

    <footer class="tl-foot" data-od-id="statusbar">
      <span class="tl-hint">drag · scroll · ← → · click a photo</span>
      <span class="tl-foot-links">
        <span id="tl-foot-status">—</span>
        <a href="#" id="tl-reconcile" hidden>raw EXIF</a>
        <a href="#" id="tl-reset">reset</a>
      </span>
    </footer>
  </div>

  <script type="module" src="/src/timeline.ts"></script>
</body>
</html>
